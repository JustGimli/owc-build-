upstream backend {
    server 127.0.0.1:8000;
}

# HTTP-сервер: перенаправляет все запросы на HTTPS
server {
    listen 80;
    server_name aibridge.space;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS-сервер с использованием SSL-сертификата и ключа
server {
    listen 443 ssl;
    server_name aibridge.space;

    # Путь к SSL-сертификату и приватному ключу
    ssl_certificate     /etc/nginx/ssl/aibridge.space.crt;
    ssl_certificate_key /etc/nginx/ssl/aibridge.space.key;

    resolver 8.8.8.8;
    client_max_body_size 20M;

    # Проксирование запросов к backend (например, к Django/Gunicorn)
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Обслуживание статических файлов (Single Page Application)
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Обслуживание медиафайлов с кэшированием на 30 дней
    location /media/ {
        alias /var/www/html/media/;
        expires 30d;
    }

    # Обслуживание статичных файлов админки Django
    location /static/admin/ {
        alias /var/www/html/admin/static/admin/;
    }
}
